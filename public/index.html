    <title>NAVADA VC - Premier UK-Africa Venture Capital Fund</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Inter', 'system-ui', 'sans-serif']
            },
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0f0f0f'
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'fadeInUp': 'fadeInUp 0.6s ease-out',
              'slideInRight': 'slideInRight 0.8s ease-out'
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' }
              },
              glow: {
                '0%': { boxShadow: '0 0 5px rgba(16, 185, 129, 0.5)' },
                '100%': { boxShadow: '0 0 20px rgba(16, 185, 129, 0.8)' }
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(30px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(30px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' }
              }
            },
            backdropBlur: {
              'xs': '2px'
            }
          }
        }
      }
    </script>

    <!-- Performance optimizations -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//api.openai.com" />

    <style>
      /* Custom CSS for enhanced performance and styling */
      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Improved scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #0f0f0f;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(45deg, #10b981, #3b82f6);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(45deg, #059669, #2563eb);
      }

      /* Custom gradient backgrounds */
      .gradient-bg {
        background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      }

      .card-gradient {
        background: linear-gradient(135deg, rgba(31, 41, 55, 0.8) 0%, rgba(17, 24, 39, 0.8) 100%);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(75, 85, 99, 0.3);
      }

      /* Enhanced button styles */
      .btn-primary {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        transition: all 0.3s ease;
      }

      .btn-primary:hover {
        box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
        transform: translateY(-2px);
      }

      /* Loading animations */
      .loading-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      /* Performance optimizations */
      .gpu-accelerated {
        transform: translateZ(0);
        will-change: transform;
      }

      /* Spotlight animation */
      @keyframes spotlight {
        0% {
          opacity: 0;
          transform: translate(-72%, -62%) scale(0.5);
        }
        100% {
          opacity: 1;
          transform: translate(-50%,-40%) scale(1);
        }
      }

      .animate-spotlight {
        animation: spotlight 2s ease 0.75s 1 forwards;
      }
    </style>
  </head>
